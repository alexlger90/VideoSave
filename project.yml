name: VideoSave

options:
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.videosave.app
    INFOPLIST_FILE: Sources/Info.plist

targets:
  VideoSave:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Models
    dependencies:
      - target: VideoSaveShare
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: VideoSave
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: VideoSave
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.videosave.app
            CFBundleURLSchemes:
              - videosave
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        NSPhotoLibraryAddUsageDescription: VideoSave benötigt Zugriff, um fertige Videos in Fotos zu speichern.
        NSPhotoLibraryUsageDescription: VideoSave benötigt Zugriff, um fertige Videos in Fotos zu speichern.

  VideoSaveShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.videosave.app.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: VideoSave
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  VideoSaveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: VideoSave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.videosave.app.tests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        CODE_SIGNING_ALLOWED: NO

schemes:
  VideoSave:
    build:
      targets:
        VideoSave: all
    test:
      targets:
        - VideoSaveTests
