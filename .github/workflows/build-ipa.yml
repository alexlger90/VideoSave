name: Build VideoSave IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Real-ESRGAN x2plus CoreML model
        run: |
          mkdir -p Models
          curl -L \
            -o /tmp/realesrgan.zip \
            https://github.com/hanxiao/real-esrgan-coreml/releases/download/v1.0.0/RealESRGAN_x2plus_522_fp16.zip
          unzip -o /tmp/realesrgan.zip -d Models

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Package complete app source
        run: |
          rm -rf /tmp/VideoSave-complete
          mkdir -p /tmp/VideoSave-complete
          rsync -a ./ /tmp/VideoSave-complete/ \
            --exclude '.git/' \
            --exclude 'build/' \
            --exclude 'build-simulator/' \
            --exclude 'Payload/' \
            --exclude 'TestResults.xcresult/'
          ditto -c -k --sequesterRsrc --keepParent /tmp/VideoSave-complete VideoSave-complete.zip

      - name: Upload complete app ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VideoSave-Complete
          path: VideoSave-complete.zip

      - name: Test resolver and access policy
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project VideoSave.xcodeproj \
            -scheme VideoSave \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoSave-TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project VideoSave.xcodeproj \
            -scheme VideoSave \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VideoSave.app Payload/
          test -d Payload/VideoSave.app/PlugIns/VideoSaveShare.appex
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" Payload/VideoSave.app/PlugIns/VideoSaveShare.appex/Info.plist | grep -qx com.apple.share-services
          zip -r VideoSave-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VideoSave-IPA
          path: VideoSave-unsigned.ipa

      - name: Capture cockpit preview
        continue-on-error: true
        timeout-minutes: 2
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          APP_PATH="build-simulator/Build/Products/Debug-iphonesimulator/VideoSave.app"
          test -d "$APP_PATH"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          python3 - "$DEVICE_ID" <<'PY'
          import subprocess, sys
          subprocess.run(["xcrun", "simctl", "bootstatus", sys.argv[1], "-b"], check=True, timeout=90)
          PY
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.videosave.app
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot Cockpit.png
          xcrun simctl shutdown "$DEVICE_ID" || true

      - name: Upload cockpit preview
        if: ${{ always() && hashFiles('Cockpit.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: VideoSave-Cockpit
          path: Cockpit.png
