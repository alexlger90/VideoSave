name: Build VideoSave IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Real-ESRGAN x2plus CoreML model
        run: |
          mkdir -p Models
          curl -L \
            -o /tmp/realesrgan.zip \
            https://github.com/hanxiao/real-esrgan-coreml/releases/download/v1.0.0/RealESRGAN_x2plus_522_fp16.zip
          unzip -o /tmp/realesrgan.zip -d Models

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test resolver and access policy
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project VideoSave.xcodeproj \
            -scheme VideoSave \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoSave-TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project VideoSave.xcodeproj \
            -scheme VideoSave \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VideoSave.app Payload/
          zip -r VideoSave-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VideoSave-IPA
          path: VideoSave-unsigned.ipa
