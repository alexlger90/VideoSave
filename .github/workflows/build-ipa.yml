name: Build VideoSave IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: videosave-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Real-ESRGAN x2plus CoreML model
        run: |
          mkdir -p Models
          curl -L \
            -o /tmp/realesrgan.zip \
            https://github.com/hanxiao/real-esrgan-coreml/releases/download/v1.0.0/RealESRGAN_x2plus_522_fp16.zip
          unzip -o /tmp/realesrgan.zip -d Models

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test resolver and access policy
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project VideoSave.xcodeproj \
            -scheme VideoSave \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VideoSave-TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project VideoSave.xcodeproj \
            -scheme VideoSave \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VideoSave.app Payload/
          test -d Payload/VideoSave.app/PlugIns/VideoSaveShare.appex
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" Payload/VideoSave.app/PlugIns/VideoSaveShare.appex/Info.plist | grep -qx com.apple.share-services
          zip -r VideoSave-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VideoSave-IPA
          path: VideoSave-unsigned.ipa
          retention-days: 30

      - name: Remove older workflow runs
        if: success() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          current_run = int(os.environ["CURRENT_RUN_ID"])
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          old_run_ids = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repository}/actions/runs?per_page=100&page={page}"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)

              runs = payload.get("workflow_runs", [])
              for run in runs:
                  run_id = run.get("id")
                  if run_id != current_run and run.get("status") == "completed":
                      old_run_ids.append(run_id)

              if len(runs) < 100:
                  break
              page += 1

          deleted = 0
          for run_id in old_run_ids:
              url = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}"
              request = urllib.request.Request(url, headers=headers, method="DELETE")
              try:
                  with urllib.request.urlopen(request) as response:
                      response.read()
                  deleted += 1
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise

          print(f"Removed {deleted} older workflow run(s).")
          PY
